<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>YOLO Labeler - 标注工具</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- 顶部工具栏 -->
    <header class="toolbar">
      <div class="toolbar-left">
        <button id="btn-open-dir" class="toolbar-btn primary">
          <span class="icon">📂</span>
          <span>打开目录</span>
        </button>
        <button id="btn-save" class="toolbar-btn" disabled>
          <span class="icon">💾</span>
          <span>保存</span>
        </button>
        <div class="separator"></div>
        <button id="btn-prev" class="toolbar-btn" disabled>
          <span class="icon">◀</span>
          <span>上一张 (A)</span>
        </button>
        <button id="btn-next" class="toolbar-btn" disabled>
          <span class="icon">▶</span>
          <span>下一张 (D)</span>
        </button>
        <div class="separator"></div>
        <span id="current-file" class="current-file">未打开文件</span>
        <span id="save-status" class="save-status"></span>
      </div>
      <div class="toolbar-right"></div>
    </header>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 左侧文件列表 -->
      <aside class="sidebar left-sidebar">
        <div class="panel-header">
          <h3>📁 文件列表</h3>
          <span id="file-count" class="badge">0</span>
        </div>
        <div class="panel-content">
          <ul id="file-list" class="file-list"></ul>
        </div>
      </aside>

      <!-- 中间画布区域 -->
      <section class="canvas-container">
        <div id="canvas-wrapper" class="canvas-wrapper">
          <canvas id="main-canvas"></canvas>
          <div id="empty-state" class="empty-state">
            <div class="empty-icon">🖼️</div>
            <p>点击"打开目录"选择图片文件夹</p>
            <p class="hint">支持 JPG, PNG, BMP, GIF, WebP 格式</p>
          </div>
        </div>
        <!-- 坐标信息显示 -->
        <div id="coord-info" class="coord-info">
          <span id="image-info" class="image-info"></span>
          <span id="mouse-pos">X: 0, Y: 0</span>
          <span id="box-size" class="box-size"></span>
        </div>
        <!-- 右下角缩放控制 -->
        <div id="canvas-zoom-controls" class="canvas-zoom-controls">
          <button id="btn-zoom-out" class="zoom-btn" title="缩小">−</button>
          <span id="zoom-level" class="zoom-level-display">100%</span>
          <button id="btn-zoom-in" class="zoom-btn" title="放大">+</button>
          <button id="btn-zoom-fit" class="zoom-btn fit" title="适应视图">适应</button>
        </div>
      </section>

      <!-- 右侧面板 -->
      <aside class="sidebar right-sidebar">
        <!-- 类别管理 -->
        <div class="panel classes-panel">
          <div class="panel-header">
            <h3>🏷️ 类别</h3>
            <div class="panel-header-right">
              <span id="class-count" class="badge">0</span>
              <button id="btn-add-class" class="btn-icon" title="添加类别">+</button>
            </div>
          </div>
          <div class="panel-content">
            <ul id="class-list" class="class-list"></ul>
          </div>
        </div>

        <!-- 当前标注列表 -->
        <div class="panel labels-panel">
          <div class="panel-header">
            <h3>📋 标注</h3>
            <span id="label-count" class="badge">0</span>
          </div>
          <div class="panel-content">
            <ul id="label-list" class="label-list"></ul>
          </div>
        </div>

        <!-- 快捷键提示 -->
        <div class="panel shortcuts-panel">
          <div class="panel-header">
            <h3>⌨️ 快捷键</h3>
          </div>
          <div class="panel-content shortcuts-content">
            <div class="shortcut-item"><kbd>W</kbd> 创建标注</div>
            <div class="shortcut-item"><kbd>A</kbd> 上一张</div>
            <div class="shortcut-item"><kbd>D</kbd> 下一张</div>
            <div class="shortcut-item"><kbd>Del</kbd> 删除选中</div>
            <div class="shortcut-item"><kbd>1-9</kbd> 选择类别</div>
            <div class="shortcut-item"><kbd>滚轮</kbd> 缩放</div>
            <div class="shortcut-item"><kbd>空格+拖拽</kbd> 平移</div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <!-- 类别选择弹窗 -->
  <div id="class-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>选择类别</h3>
        <button id="modal-close" class="btn-close">×</button>
      </div>
      <div class="modal-body">
        <ul id="modal-class-list" class="modal-class-list"></ul>
      </div>
    </div>
  </div>

  <!-- 添加类别弹窗 -->
  <div id="add-class-modal" class="modal hidden">
    <div class="modal-content small">
      <div class="modal-header">
        <h3>添加类别</h3>
        <button id="add-class-modal-close" class="btn-close">×</button>
      </div>
      <div class="modal-body">
        <input type="text" id="new-class-input" class="text-input" placeholder="输入类别名称" autofocus>
        <div class="modal-actions">
          <button id="btn-confirm-add-class" class="btn primary">添加</button>
          <button id="btn-cancel-add-class" class="btn">取消</button>
        </div>
      </div>
    </div>
  </div>

  <script src="canvas.js"></script>
  <script src="fileManager.js"></script>
  <script src="classManager.js"></script>
  <script src="shortcuts.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
